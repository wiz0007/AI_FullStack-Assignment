name: Continuous Delivery — Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Production Release & Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Database Configuration
        id: check_db
        run: |
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "PRODUCTION_DATABASE_URL secret is not configured; skipping production DB migration step."
            echo "has_db=false" >> $GITHUB_OUTPUT
          else
            echo "has_db=true" >> $GITHUB_OUTPUT
          fi

      - name: Apply Database Migrations
        if: steps.check_db.outputs.has_db == 'true'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

      - name: Deploy Production Application
        run: npm run build
        env:
          NODE_ENV: "production"
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/oneatlas_prod?schema=public' }}
          NEXT_PUBLIC_APP_URL: "https://oneatlas.dev"
