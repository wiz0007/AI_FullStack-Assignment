name: Continuous Integration

on:
  push:
    branches: [main, "sprint-*", "feature/*", "fix/*", "chore/*"]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/oneatlas_test?schema=public"
      DIRECT_URL: "postgresql://postgres:password@localhost:5432/oneatlas_test?schema=public"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify code formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Validate Prisma Schema
        run: npx prisma validate

  test:
    name: Automated Test Suites
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: oneatlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/oneatlas_test?schema=public"
      DIRECT_URL: "postgresql://postgres:password@localhost:5432/oneatlas_test?schema=public"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Database Migrations on PostgreSQL
        run: npx prisma migrate deploy

      - name: Run Automated Test Suites
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
